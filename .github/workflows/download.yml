name: Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download File
        run: |
          curl -L "https://dl.rozmusic.com/Music/1405/02/08/Masoud%20Sadeghloo%20-%20Therapist.mp3" -o file.zip

      - name: Upload File
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: file.zip
