name: Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download File
        run: |
          curl -L "https://speed.hetzner.de/100MB.bin" -o file.zip

      - name: Upload File
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: file.zip
